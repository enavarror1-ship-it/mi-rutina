<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Rutina Semanal</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F0FF;--card:#fff;--ink:#2E1F4F;--soft:#6E5E93;--lila:#A78BFA;--lila-d:#7C4DDB;--lila-l:#E9DFFF;--pink:#FFB8DA;--mint:#C6F3E0;--mint-d:#2E9E75;--sun:#FFE29A;--line:#D9CBFA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1432;--card:#2A1F47;--ink:#F3ECFF;--soft:#B9A9E0;--lila-l:#3A2B63;--line:#4A3A7A;--mint:#1F4A3D;--mint-d:#7EE0B5}}
:root[data-theme="dark"]{--bg:#1D1432;--card:#2A1F47;--ink:#F3ECFF;--soft:#B9A9E0;--lila-l:#3A2B63;--line:#4A3A7A;--mint:#1F4A3D;--mint-d:#7EE0B5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:16px;line-height:1.5;
background-image:radial-gradient(circle at 12% 8%,var(--lila-l) 0 90px,transparent 91px),radial-gradient(circle at 92% 30%,var(--lila-l) 0 60px,transparent 61px)}
h1,h2,h3{font-family:'Baloo 2','Nunito',system-ui,sans-serif;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--lila-d);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--lila) 0,#C4B0FF 60%,var(--pink) 130%);border-radius:28px;padding:18px 20px;color:#2A1650;border:3px solid #5B3A9E;box-shadow:0 6px 0 #5B3A9E;position:relative;overflow:hidden}
.hero h1{font-size:2rem;font-weight:800}
.hero p{margin:4px 0 0;font-weight:700}
.mascot{width:110px;flex:none}
.ring{width:84px;height:84px;flex:none;margin-left:auto;position:relative}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-size:1.2rem}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:18px 2px 8px;scrollbar-width:none}
.tab{flex:none;min-width:64px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 10px;text-align:center;font-weight:700}
.tab small{display:block;font-weight:600;color:var(--soft);font-size:.75rem}
.tab[aria-selected="true"]{background:var(--lila-d);border-color:#5B3A9E;color:#fff;box-shadow:0 4px 0 #5B3A9E}
.tab[aria-selected="true"] small{color:#EADFFF}
.tab.full small::after{content:" ★"}
.dayhead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:14px 2px 10px;flex-wrap:wrap}
.dayhead h2{font-size:1.9rem}
.dayhead span{color:var(--soft);font-weight:700}
.ghost{background:transparent;border:2px dashed var(--line);border-radius:14px;padding:6px 12px;font-weight:700;color:var(--soft)}
.ghost:hover{border-color:var(--lila-d);color:var(--lila-d)}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.ex{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 14px}
.ex.done{background:var(--mint);border-color:var(--mint-d)}
.ex.done .nm{text-decoration:line-through;text-decoration-thickness:2px;opacity:.75}
.chk{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--lila);background:var(--lila-l);padding:0;display:grid;place-items:center}
.done .chk{border-color:var(--mint-d);background:#fff}
.chk svg{width:38px;height:38px}
.body{flex:1;min-width:0}
.nm{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.15rem;line-height:1.2}
.mu{display:inline-block;background:var(--lila-l);color:var(--lila-d);border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:700;margin:2px 0}
.done .mu{background:#fff;color:var(--mint-d)}
.sr{font-weight:800;margin-left:6px}
.nt{margin:2px 0 0;color:var(--soft);font-size:.92rem}
.del{flex:none;background:none;border:0;color:var(--soft);font-size:1.3rem;line-height:1;padding:4px 8px;border-radius:10px}
.del:hover{color:#D6336C;background:var(--lila-l)}
.empty{text-align:center;background:var(--card);border:2px dashed var(--line);border-radius:24px;padding:24px}
.win{display:none;text-align:center;background:var(--sun);color:#4A3200;border:3px solid #C99A1E;border-radius:22px;padding:12px;margin-bottom:12px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.2rem}
.win.on{display:block;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.panel{margin-top:22px;background:var(--card);border:3px solid var(--lila);border-radius:26px;padding:16px 18px}
.panel h3{font-size:1.4rem;margin-bottom:10px}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.grid .full{grid-column:1/-1}
label{display:block;font-weight:700;font-size:.9rem;color:var(--soft)}
input,select,textarea{width:100%;margin-top:3px;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 11px}
.go{margin-top:12px;width:100%;background:var(--lila-d);color:#fff;border:3px solid #5B3A9E;border-radius:16px;padding:11px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 #5B3A9E}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #5B3A9E}
.foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
@media (max-width:520px){.mascot{width:78px}.hero h1{font-size:1.5rem}.ring{width:66px;height:66px}.grid{grid-template-columns:1fr}}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{padding-bottom:120px}
.deco{position:absolute;right:8px;top:4px;width:130px;pointer-events:none;opacity:.9}
.streak{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:14px;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:10px 14px}
.streak svg.fl{width:50px;flex:none}
.streak .big{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.6rem;line-height:1;display:block}
.streak small{color:var(--soft);font-weight:700;display:block}
.wk{display:flex;gap:5px;margin-left:auto}
.wk i{width:28px;height:28px;border-radius:50%;background:var(--lila-l);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:800;color:var(--soft)}
.wk i.on{background:var(--lila-d);border-color:#5B3A9E;color:#fff}
.wk i.rest{opacity:.45}
.wk i.today{outline:3px solid var(--pink);outline-offset:1px}
.restrow{display:flex;align-items:center;gap:10px;margin:0 2px 10px;color:var(--soft);font-weight:700}
.restrow select{width:auto;margin:0}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.st{min-width:46px;height:46px;border-radius:14px;border:2px solid var(--lila);background:var(--lila-l);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.05rem;color:var(--lila-d);padding:0 8px}
.st.on{background:var(--lila-d);border-color:#5B3A9E;color:#fff;box-shadow:0 3px 0 #5B3A9E}
.done .st.on{background:var(--mint-d);border-color:var(--mint-d);box-shadow:none;color:#fff}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:none}
.timer.on{display:block;animation:pop .35s ease-out}
.tbox{max-width:560px;margin:0 auto;background:#3B2270;color:#fff;border-radius:26px;border:3px solid #A78BFA;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 -6px 24px rgba(60,30,120,.35)}
.tbox svg{width:52px;flex:none}
.tt{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.3rem;line-height:1}
.tp{height:7px;background:#5B3A9E;border-radius:9px;margin-top:6px;overflow:hidden}
.tp b{display:block;height:100%;width:100%;background:var(--pink);border-radius:9px}
.tbtn{background:#5B3A9E;color:#fff;border:2px solid #A78BFA;border-radius:14px;min-width:46px;height:46px;font-weight:800;padding:0 9px}
.tbox .r{display:flex;gap:6px}
@media (max-width:520px){.wk{width:100%;justify-content:space-between;margin-left:0}.tbox{gap:8px}.tt{font-size:1.9rem}.tbtn{min-width:42px;padding:0 6px;font-size:.85rem}.tbox svg{width:40px}.deco{width:90px}}
@media (prefers-reduced-motion:reduce){.win.on,.timer.on{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <svg class="deco" viewBox="0 0 130 50" aria-hidden="true"><path d="M20 8l3 7 7 1-5 5 1 8-6-4-7 4 2-8-5-5 7-1z" fill="#FFE29A" stroke="#fff" stroke-width="2"/><path d="M76 20c-8-9-20 2-10 10l10 8 10-8c10-8-2-19-10-10z" fill="#FFB8DA" stroke="#fff" stroke-width="2"/><path d="M108 6l2 5 5 1-4 3 1 5-4-3-5 3 1-5-4-3 5-1z" fill="#fff" fill-opacity=".9"/></svg>
    <svg class="mascot" id="mascot" viewBox="0 0 120 120" aria-hidden="true"></svg>
    <div><h1>Mi Rutina</h1><p id="hello"></p></div>
    <div class="ring"><svg viewBox="0 0 84 84" width="100%" height="100%"><circle cx="42" cy="42" r="34" fill="#fff" fill-opacity=".45" stroke="#fff" stroke-opacity=".6" stroke-width="9"/><circle id="arc" cx="42" cy="42" r="34" fill="none" stroke="#5B3A9E" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 214" transform="rotate(-90 42 42)"/></svg><b id="pct">0%</b></div>
  </header>
  <section class="streak" id="streak" aria-label="Racha"></section>
  <div class="tabs" id="tabs" role="tablist" aria-label="Días de la semana"></div>
  <div class="dayhead"><h2 id="dayname"></h2><span id="daycount"></span></div>
  <div class="win" id="win"><svg viewBox="0 0 40 40" width="38" style="vertical-align:middle;margin-right:6px" aria-hidden="true"><path d="M10 6h20v10a10 10 0 0 1-20 0z" fill="#FFC93C" stroke="#8A5A00" stroke-width="2.5"/><path d="M10 9H4c0 8 3 10 7 10M30 9h6c0 8-3 10-7 10" fill="none" stroke="#8A5A00" stroke-width="2.5"/><rect x="16" y="26" width="8" height="6" fill="#FFC93C" stroke="#8A5A00" stroke-width="2.5"/><rect x="11" y="32" width="18" height="5" rx="2" fill="#A78BFA" stroke="#5B3A9E" stroke-width="2.5"/><circle cx="16" cy="14" r="1.6" fill="#2E1F4F"/><circle cx="24" cy="14" r="1.6" fill="#2E1F4F"/><path d="M17 18q3 3 6 0" stroke="#2E1F4F" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>¡Día completado! ¡Increíble trabajo!</div>
  <label class="restrow" for="rs">Descanso entre series <select id="rs"><option value="30">30 s</option><option value="45">45 s</option><option value="60">1 min</option><option value="90">1:30</option><option value="120">2 min</option></select></label>
  <ul class="list" id="list"></ul>
  <section class="panel" aria-labelledby="addt">
    <h3 id="addt">Agregar ejercicio</h3>
    <form id="f" class="grid">
      <div class="full"><label for="fn">Ejercicio<input id="fn" required maxlength="60" placeholder="Ej: Abducción de cadera"></label></div>
      <div><label for="fd">Día<select id="fd"></select></label></div>
      <div><label for="fm">Músculo<input id="fm" maxlength="40" placeholder="Ej: Glúteo medio"></label></div>
      <div><label for="fs">Series<input id="fs" type="number" min="1" max="20" value="3"></label></div>
      <div><label for="fr">Repeticiones<input id="fr" type="number" min="1" max="100" value="12"></label></div>
      <div class="full"><label for="ft">Notas<textarea id="ft" rows="2" maxlength="120" placeholder="Indicaciones para hacerlo bien"></textarea></label></div>
      <button class="go full" type="submit">Agregar ejercicio</button>
    </form>
  </section>
  <div class="foot">
    <button class="ghost" id="rd">Reiniciar checks del día</button>
    <button class="ghost" id="rw">Reiniciar toda la semana</button>
    <button class="ghost" id="rp">Restaurar rutina original</button>
  </div>
</div>
<div class="timer" id="timer" role="timer"><div class="tbox"><svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="14" cy="14" r="8" fill="#FF8FB8" stroke="#fff" stroke-width="2.5"/><circle cx="46" cy="14" r="8" fill="#FF8FB8" stroke="#fff" stroke-width="2.5"/><circle cx="30" cy="35" r="22" fill="#FFE29A" stroke="#fff" stroke-width="3"/><circle cx="22" cy="33" r="3" fill="#2E1F4F"/><circle cx="38" cy="33" r="3" fill="#2E1F4F"/><path d="M24 42q6 6 12 0" stroke="#2E1F4F" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="16" cy="40" r="3" fill="#FFB8DA"/><circle cx="44" cy="40" r="3" fill="#FFB8DA"/></svg><div style="flex:1;min-width:0"><div class="tt" id="tt">0:00</div><div class="tp"><b id="tpb"></b></div></div><div class="r"><button class="tbtn" id="tm" aria-label="Restar 15 segundos">−15</button><button class="tbtn" id="tpl" aria-label="Sumar 15 segundos">+15</button><button class="tbtn" id="tx">Saltar</button></div></div></div>
<script>
var DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
var G='Hip Thrust',B='Sentadilla Búlgara';
var BASE=[
[['Glúteos','Hip Thrust',4,12,'Máxima contracción arriba (pausa de 1 seg)'],['Glúteos y Cuádriceps','Sentadilla Búlgara',4,12,'4 series de 12 repeticiones por pierna'],['Aductores y Glúteos','Sentadilla Sumo',4,12,'Pies más abiertos del ancho de hombros'],['Cuádriceps','Sentadilla Libre',4,12,'Espalda recta y bajar a 90 grados'],['Cuádriceps','Sentadilla Squat / Goblet',4,12,'Sostener mancuerna al pecho, abdomen firme'],['Cuádriceps','Extensión de Cuádriceps',4,12,'Movimiento guiado o con banda / mancuerna']],
[['Hombro (Deltoides)','Press Militar con Mancuernas',3,12,'Ejercicio en casa (sentado o de pie)'],['Hombro (Lateral)','Elevaciones Laterales',3,12,'Codos ligeramente flexionados, sin balanceo'],['Bíceps','Curl de Bíceps con Barra o Mancuernas',3,12,'Codos pegados al cuerpo durante todo el rango'],['Bíceps (Braquial)','Curl Martillo con Mancuernas',3,12,'Agarre neutro (palmas mirándose)'],['Pecho (Pectoral Mayor)','Press de Pecho en Piso o Banco',3,12,'Con mancuernas o barra corta'],['Pecho (Apertura)','Aperturas de Pecho (Flyes)',3,12,'Controlar el estiramiento al bajar']],
[['Glúteos','Hip Thrust',4,12,'Barbilla pegada al pecho, enfoque en glúteos'],['Isquiotibiales / Femorales','Peso Muerto Rumano (RDL)',4,12,'Empujar cadera hacia atrás, rodillas semi-flectadas'],['Glúteos y Femorales','Sentadilla Búlgara',4,12,'Torso ligeramente inclinado al frente (4 por pierna)'],['Femorales y Lumbar','Buenos Días (Good Morning)',4,12,'Barra o mancuerna tras la nuca, bisagra de cadera'],['Isquiotibiales / Femorales','Curl Femoral con Mancuerna / Banda',4,12,'Tumbado boca abajo, sujetando mancuerna en pies']],
[['Espalda (Dorsal)','Remo con Barra o Mancuernas',3,12,'Espalda inclinada a 45°, llevar codos hacia atrás'],['Espalda (Unilateral)','Remo Unilateral con Mancuerna',3,12,'Apoyo en silla/banco (3 series de 12 rep por lado)'],['Espalda y Pecho','Pullover con Mancuerna',3,12,'Acostado en banco o piso, brazos semi-extendidos'],['Tríceps','Extensiones Copa a Dos Manos',3,12,'Mancuerna por detrás de la cabeza, codos cerrados'],['Tríceps','Press Francés con Barra o Mancuernas',3,12,'Acostado en piso o banco, llevar hacia las sienes'],['Tríceps','Patada de Tríceps con Mancuerna',3,12,'Codo elevado y fijo al costado del cuerpo']],
[['Glúteos','Hip Thrust',4,12,'Enfoque en contracción de glúteo arriba'],['Glúteos y Cuádriceps','Sentadilla Búlgara',4,12,'4 series de 12 repeticiones por pierna'],['Aductores y Glúteos','Sentadilla Sumo',4,12,'Pies abiertos apuntando hacia afuera'],['Cuádriceps','Sentadilla Libre',4,12,'Controlar postura y profundidad'],['Cuádriceps','Sentadilla Squat / Goblet',4,12,'Mantener abdomen bien contraído'],['Cuádriceps','Extensión de Cuádriceps',4,12,'Extensión completa y bajada pausada']],
[],[]];
var KEY='mi-rutina-v1',S,cur,tmr=null,tend=0,tdur=0,audio=null;
function monday(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function fresh(){var n=0,plan=BASE.map(function(day){return day.map(function(e){return{id:'e'+(n++),m:e[0],n:e[1],s:e[2],r:e[3],t:e[4]}})});return{plan:plan,n:n,wk:monday(),done:{},sets:{},hist:{},best:0,rest:60}}
function load(){try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):null}catch(e){S=null}
if(!S||!S.plan)S=fresh();S.sets=S.sets||{};S.hist=S.hist||{};S.best=S.best||0;S.rest=S.rest||60;if(S.wk!==monday()){S.wk=monday();S.done={};S.sets={}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function face(done){var st='stroke="#5B3A9E" stroke-width="3" stroke-linecap="round" fill="none"';
return done?'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#FFE29A" stroke="#5B3A9E" stroke-width="2.5"/><path d="M11 17q3-5 6 0M23 17q3-5 6 0" '+st+'/><path d="M12 24q8 10 16 0z" fill="#FF8FB8" stroke="#5B3A9E" stroke-width="2.5" stroke-linejoin="round"/><circle cx="9" cy="24" r="3" fill="#FFB8DA"/><circle cx="31" cy="24" r="3" fill="#FFB8DA"/></svg>'
:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#DCCBFF" stroke="#7C4DDB" stroke-width="2.5"/><path d="M11 18h7M22 18h7M16 27h8" '+st.replace('#5B3A9E','#7C4DDB')+'/></svg>'}
function mascot(p){var mouth=p>=1?'<path d="M46 74q14 16 28 0z" fill="#FF8FB8" stroke="#5B3A9E" stroke-width="3" stroke-linejoin="round"/>':p>0?'<path d="M48 76q12 10 24 0" stroke="#5B3A9E" stroke-width="3.5" fill="none" stroke-linecap="round"/>':'<path d="M50 80h20" stroke="#5B3A9E" stroke-width="3.5" stroke-linecap="round"/>';
var eyes=p>=1?'<path d="M40 62q5-8 10 0M70 62q5-8 10 0" stroke="#5B3A9E" stroke-width="3.5" fill="none" stroke-linecap="round"/>':'<circle cx="45" cy="63" r="5" fill="#2E1F4F"/><circle cx="75" cy="63" r="5" fill="#2E1F4F"/><circle cx="47" cy="61" r="1.8" fill="#fff"/><circle cx="77" cy="61" r="1.8" fill="#fff"/>';
document.getElementById('mascot').innerHTML='<path d="M30 60Q20 44 24 32M90 60Q100 44 96 32" stroke="#5B3A9E" stroke-width="5" fill="none" stroke-linecap="round"/><g fill="#7C4DDB" stroke="#5B3A9E" stroke-width="3"><rect x="10" y="20" width="9" height="24" rx="3"/><rect x="101" y="20" width="9" height="24" rx="3"/><rect x="19" y="24" width="7" height="16" rx="2" fill="#A78BFA"/><rect x="94" y="24" width="7" height="16" rx="2" fill="#A78BFA"/></g><path d="M26 32h68" stroke="#5B3A9E" stroke-width="5" stroke-linecap="round"/><ellipse cx="60" cy="76" rx="38" ry="34" fill="#D9C8FF" stroke="#5B3A9E" stroke-width="3.5"/>'+eyes+mouth+'<circle cx="35" cy="76" r="5" fill="#FFB8DA"/><circle cx="85" cy="76" r="5" fill="#FFB8DA"/>'+(p>=1?'<path d="M14 70l3 6 6 1-5 4 2 6-6-3-6 3 2-6-5-4 6-1z" fill="#FFE29A" stroke="#C99A1E" stroke-width="1.5"/><path d="M104 60l3 6 6 1-5 4 2 6-6-3-6 3 2-6-5-4 6-1z" fill="#FFE29A" stroke="#C99A1E" stroke-width="1.5"/>':'')}
function stats(i){var l=S.plan[i],c=l.filter(function(e){return S.done[e.id]}).length;return{c:c,t:l.length}}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dkey(i){var d=new Date(S.wk+'T00:00:00');d.setDate(d.getDate()+i);return ymd(d)}
function find(id){for(var i=0;i<7;i++)for(var j=0;j<S.plan[i].length;j++)if(S.plan[i][j].id===id)return S.plan[i][j]}
function nset(e){return S.done[e.id]?e.s:Math.min(S.sets[e.id]||0,e.s)}
function frac(i){var t=0,c=0;S.plan[i].forEach(function(e){t+=e.s;c+=nset(e)});return t?c/t:0}
function calc(){var t=new Date();t.setHours(0,0,0,0);var tk=ymd(t),n=0,d=new Date(t),g=0;while(g++<400){var k=ymd(d);if(S.plan[(d.getDay()+6)%7].length){if(S.hist[k])n++;else if(k!==tk)break}d.setDate(d.getDate()-1)}return n}
function flame(n){var on=n>0,a=on?'#FF9F43':'#CFC3EE',b=on?'#FFD86B':'#E6DEFA';return '<svg class="fl" viewBox="0 0 60 70" aria-hidden="true"><path d="M30 4C34 20 52 28 52 46a22 22 0 0 1-44 0C8 34 18 30 20 18c4 4 6 8 6 12 4-6 6-14 4-26z" fill="'+a+'" stroke="#5B3A9E" stroke-width="3" stroke-linejoin="round"/><path d="M30 34c3 8 12 12 12 22a12 12 0 0 1-24 0c0-8 8-10 12-22z" fill="'+b+'"/>'+(on?'<circle cx="24" cy="52" r="2.6" fill="#2E1F4F"/><circle cx="36" cy="52" r="2.6" fill="#2E1F4F"/><path d="M26 58q4 5 8 0" stroke="#2E1F4F" stroke-width="2.5" fill="none" stroke-linecap="round"/>':'<path d="M21 52h6M33 52h6M27 59h6" stroke="#5B3A9E" stroke-width="2.5" stroke-linecap="round"/>')+'</svg>'}
function renderStreak(){var n=calc();if(n>S.best){S.best=n;save()}var t=ymd(new Date()),h='';for(var i=0;i<7;i++){var k=dkey(i),c=[];if(!S.plan[i].length)c.push('rest');if(S.hist[k])c.push('on');if(k===t)c.push('today');h+='<i class="'+c.join(' ')+'">'+DAYS[i][0]+'</i>'}
document.getElementById('streak').innerHTML=flame(n)+'<div><span class="big">'+n+(n===1?' día':' días')+'</span><small>'+(n?'de racha, ¡no la rompas!':'Completa hoy para iniciar tu racha')+' · Récord '+S.best+'</small></div><div class="wk" aria-label="Semana">'+h+'</div>'}
function setsHtml(e){var n=nset(e),h='<div class="sets" role="group" aria-label="Series de '+esc(e.n)+'">';for(var i=1;i<=e.s;i++)h+='<button class="st'+(i<=n?' on':'')+'" data-s="'+e.id+'" data-n="'+i+'" aria-pressed="'+(i<=n)+'" aria-label="Serie '+i+'">'+i+'</button>';return h+'</div>'}
function commit(){var k=dkey(cur);if(S.plan[cur].length&&frac(cur)>=1)S.hist[k]=1;else delete S.hist[k];save();draw()}
function tapSet(id,n){var e=find(id),p=nset(e),v=n===p?n-1:n;S.sets[id]=v;if(v>=e.s)S.done[id]=1;else delete S.done[id];initAudio();commit();if(v>p&&frac(cur)<1)startRest();else stopRest()}
function toggleAll(id){var e=find(id);if(S.done[id]){delete S.done[id];S.sets[id]=0}else{S.done[id]=1;S.sets[id]=e.s}initAudio();commit();stopRest()}
function initAudio(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function beep(){try{initAudio();var a=audio,n=a.currentTime;[0,.25,.5].forEach(function(t,i){var o=a.createOscillator(),g=a.createGain();o.frequency.value=i===2?988:784;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,n+t);g.gain.exponentialRampToValueAtTime(.3,n+t+.02);g.gain.exponentialRampToValueAtTime(.0001,n+t+.2);o.start(n+t);o.stop(n+t+.22)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startRest(){tdur=S.rest*1000;tend=Date.now()+tdur;document.getElementById('timer').className='timer on';clearInterval(tmr);tmr=setInterval(tick,250);tick()}
function tick(){var ms=tend-Date.now();if(ms<=0){clearInterval(tmr);document.getElementById('tt').textContent='¡Ya!';document.getElementById('tpb').style.width='0%';beep();setTimeout(function(){if(Date.now()>=tend)stopRest()},2500);return}var s=Math.ceil(ms/1000);document.getElementById('tt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');document.getElementById('tpb').style.width=Math.min(100,ms/tdur*100)+'%'}
function stopRest(){clearInterval(tmr);document.getElementById('timer').className='timer'}
function adj(ms){tend+=ms;tdur=Math.max(1000,tdur+ms);clearInterval(tmr);tmr=setInterval(tick,250);tick()}
function tabs(){var h='';DAYS.forEach(function(d,i){var s=stats(i);h+='<button class="tab'+(s.t&&s.c===s.t?' full':'')+'" role="tab" aria-selected="'+(i===cur)+'" data-i="'+i+'">'+d.slice(0,3)+'<small>'+(s.t?s.c+'/'+s.t:'descanso')+'</small></button>'});document.getElementById('tabs').innerHTML=h}
function draw(){var l=S.plan[cur],s=stats(cur),p=frac(cur);
document.getElementById('dayname').textContent=DAYS[cur];
document.getElementById('daycount').textContent=s.t?s.c+' de '+s.t+' ejercicios':'Sin ejercicios';
document.getElementById('hello').textContent=s.t?(p>=1?'¡Lo lograste hoy!':p>0?'¡Sigue así, tú puedes!':'¡A entrenar!'):'Hoy toca descansar';
document.getElementById('arc').setAttribute('stroke-dasharray',(213.6*p)+' 214');
document.getElementById('pct').textContent=Math.round(p*100)+'%';
document.getElementById('win').className='win'+(s.t&&p>=1?' on':'');
mascot(s.t?p:0);tabs();renderStreak();document.getElementById('rs').value=S.rest;
var h='';if(!l.length)h='<li class="empty"><div style="width:64px;margin:0 auto">'+face(false)+'</div><h3>Día libre</h3><p class="nt">No tienes ejercicios este día. Descansa o agrega uno con el formulario de abajo.</p></li>';
l.forEach(function(e){var d=S.done[e.id];h+='<li class="ex'+(d?' done':'')+'"><button class="chk" data-c="'+e.id+'" aria-pressed="'+!!d+'" aria-label="Marcar '+esc(e.n)+' como completado">'+face(d)+'</button><div class="body"><div class="nm">'+esc(e.n)+'</div><span class="mu">'+esc(e.m||'General')+'</span><span class="sr">'+e.s+' × '+e.r+'</span>'+(e.t?'<p class="nt">'+esc(e.t)+'</p>':'')+setsHtml(e)+'</div><button class="del" data-x="'+e.id+'" aria-label="Quitar '+esc(e.n)+'">×</button></li>'});
document.getElementById('list').innerHTML=h}
document.getElementById('tabs').onclick=function(ev){var b=ev.target.closest('.tab');if(b){cur=+b.dataset.i;draw()}};
document.getElementById('list').onclick=function(ev){var c=ev.target.closest('[data-c]'),x=ev.target.closest('[data-x]');
var sb=ev.target.closest('[data-s]');if(c){toggleAll(c.dataset.c)}if(sb){tapSet(sb.dataset.s,+sb.dataset.n)}
if(x){var id2=x.dataset.x;S.plan[cur]=S.plan[cur].filter(function(e){return e.id!==id2});delete S.done[id2];delete S.sets[id2];commit()}};
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();var d=+document.getElementById('fd').value;
S.plan[d].push({id:'e'+(S.n++),m:document.getElementById('fm').value.trim(),n:document.getElementById('fn').value.trim(),s:+document.getElementById('fs').value||3,r:+document.getElementById('fr').value||12,t:document.getElementById('ft').value.trim()});
save();cur=d;this.reset();document.getElementById('fd').value=d;document.getElementById('fs').value=3;document.getElementById('fr').value=12;draw()};
document.getElementById('rd').onclick=function(){S.plan[cur].forEach(function(e){delete S.done[e.id];delete S.sets[e.id]});delete S.hist[dkey(cur)];stopRest();save();draw()};
document.getElementById('rw').onclick=function(){S.done={};S.sets={};for(var k=0;k<7;k++)delete S.hist[dkey(k)];stopRest();save();draw()};
document.getElementById('rp').onclick=function(){if(confirm('¿Volver a la rutina original? Se quitarán los ejercicios que agregaste.')){var o=S;S=fresh();S.hist=o.hist;S.best=o.best;S.rest=o.rest;stopRest();save();draw()}};
document.getElementById('rs').onchange=function(){S.rest=+this.value;save()};
document.getElementById('tm').onclick=function(){adj(-15000)};
document.getElementById('tpl').onclick=function(){adj(15000)};
document.getElementById('tx').onclick=stopRest;
load();cur=(new Date().getDay()+6)%7;
document.getElementById('fd').innerHTML=DAYS.map(function(d,i){return'<option value="'+i+'">'+d+'</option>'}).join('');
document.getElementById('fd').value=cur;draw();
</script>
</body>
</html>
